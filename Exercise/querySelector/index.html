<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Profile Card</title>
    <link rel="stylesheet" href="/Exercise/querySelector/style.css" />
  </head>
  <body>
    <div class="card">
      <!-- Student name -->
      <h1 id="studentName">Student Name</h1>
      <p class="desc">Welcome to JavaScript Class!!</p>

      <!-- Input Field -->
      <label for="nameInput">Enter student name </label>
      <input type="text" id="nameInput" placeholder="Enter student name" />

      <!-- Buttons -->
      <div class="button-group">
        <button id="changeNameBtn">Change Name</button>
        <button id="changeColorBtn">Change Color</button>
        <button id="hideTextBtn">Hide / Show</button>
        <button id="resetBtn">Reset</button>
      </div>
    </div>

    <script src="/Exercise/querySelector/app.js"></script>
  </body>
</html>
